version: '3.8'
services:
  db:
    image: postgres:16-alpine
    container_name: mes-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-mes_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  backend:
    build: ./backend
    container_name: mes-backend
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-mes_db}
      SECRET_KEY: ${SECRET_KEY:-your-super-secret-key-change-me}
    depends_on:
      - db
    ports:
      - "8000:8000"
  frontend:
    build: ./frontend
    container_name: mes-frontend
    restart: always
    depends_on:
      - backend
  nginx:
    image: nginx:stable-alpine
    container_name: mes-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - frontend
      - backend
volumes:
  postgres_data:
